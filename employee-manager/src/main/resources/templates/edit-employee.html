<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container my-5">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <h2 class="text-center mb-4">Employee System</h2>
                <div class="card">
                    <div class="card-body">
                        <form action="#" th:action="@{/employees/saveEmployee}" th:object="${employee}" method="POST">
                            
                            <input type="hidden" th:field="*{id}" />

                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" th:field="*{fullName}" class="form-control" placeholder="Enter Full Name" />
                                <p class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="text" th:field="*{email}" class="form-control" placeholder="Enter Email" />
                                <p class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Phone</label>
                                <input type="text" th:field="*{phone}" class="form-control" placeholder="Enter Phone Number" />
                                <p class="text-danger" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Department</label>
                                <input type="text" th:field="*{department}" class="form-control" placeholder="Enter Department" />
                                <p class="text-danger" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></p>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Salary</label>
                                <input type="number" step="0.01" th:field="*{salary}" class="form-control" placeholder="Enter Salary" />
                                <p class="text-danger" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></p>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-success">Submit</button>
                            </div>
                        </form>
                        <hr>
                        <a th:href="@{/employees}" class="btn btn-secondary btn-sm">Back to Employee List</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
